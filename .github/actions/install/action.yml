name: Install
description: >-
  pnpm from the `packageManager` field, Node.js from .nvmrc, and the pnpm store
  from a cache keyed on pnpm-lock.yaml.

runs:
  using: composite
  steps:
    # Before setup-node, because `cache: pnpm` asks pnpm for the store path. No
    # `version` input: the action reads `packageManager` in package.json.
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm

    # `--frozen-lockfile` fails the job when package.json and pnpm-lock.yaml do
    # not agree.
    - shell: bash
      run: pnpm install --frozen-lockfile

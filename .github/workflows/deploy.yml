name: Deploy

# Deploys the Workers of Daluang to Cloudflare. `release.yml` calls this workflow after
# release-please cuts a release, with the tag of the release. A person can also run it from
# the Actions tab, for example to deploy a tag again after a failure.
#
# Each value comes from the settings of the GitHub repository, so a fork needs no change to
# a file. docs: apps/docs/src/pages/guide/deploy.md lists each secret and variable.
on:
  workflow_call:
    inputs:
      ref:
        description: The tag or the branch to deploy.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: The tag or the branch to deploy, for example v0.1.0.
        required: true
        type: string

permissions:
  contents: read

# A deploy must not stop halfway, so runs wait in a queue.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  LEFTHOOK: 0
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  cms:
    name: Deploy the CMS
    runs-on: ubuntu-latest
    environment: production
    env:
      CMS_DOMAIN: ${{ vars.CMS_DOMAIN }}
      ALLOWED_GITHUB_USERS: ${{ vars.ALLOWED_GITHUB_USERS }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      # GitHub refuses a secret name that starts with GITHUB_.
      AUTH_GITHUB_CLIENT_ID: ${{ secrets.AUTH_GITHUB_CLIENT_ID }}
      AUTH_GITHUB_CLIENT_SECRET: ${{ secrets.AUTH_GITHUB_CLIENT_SECRET }}
    steps:
      # Fail at once, with the name of each missing value, before a step changes anything.
      - name: Check the settings of the repository
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CMS_DOMAIN ALLOWED_GITHUB_USERS BETTER_AUTH_SECRET AUTH_GITHUB_CLIENT_ID AUTH_GITHUB_CLIENT_SECRET; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Set these secrets or variables in the settings of the repository:$missing"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/install

      # The first deploy of a fork makes the database. The command runs in a folder with no
      # Wrangler config, so it does not offer to edit one.
      - name: Make the database if it is missing
        working-directory: apps/cms
        run: |
          if pnpm exec wrangler d1 info daluang > /dev/null 2>&1; then
            echo "The database daluang exists."
          else
            pnpm exec wrangler d1 create daluang --cwd "$RUNNER_TEMP"
          fi

      # Before the deploy, so the new code never runs on an old schema. Wrangler finds the
      # database by the name in wrangler.jsonc.
      - name: Apply the migrations
        working-directory: apps/cms
        run: pnpm exec wrangler d1 migrations apply DB --remote

      - name: Build the CMS
        run: pnpm build

      # The values of the app go up with the version, as secrets of the Worker. The file is
      # in the temporary folder of the runner, and only this step reads it.
      - name: Deploy the CMS
        working-directory: apps/cms
        run: |
          umask 077
          secrets_file="$RUNNER_TEMP/cms-secrets.json"
          jq -n \
            --arg secret "$BETTER_AUTH_SECRET" \
            --arg url "https://$CMS_DOMAIN" \
            --arg id "$AUTH_GITHUB_CLIENT_ID" \
            --arg client_secret "$AUTH_GITHUB_CLIENT_SECRET" \
            --arg users "$ALLOWED_GITHUB_USERS" \
            '{BETTER_AUTH_SECRET: $secret, BETTER_AUTH_URL: $url, GITHUB_CLIENT_ID: $id, GITHUB_CLIENT_SECRET: $client_secret, ALLOWED_GITHUB_USERS: $users}' \
            > "$secrets_file"
          pnpm exec wrangler deploy --secrets-file "$secrets_file" --domain "$CMS_DOMAIN"
          rm -f "$secrets_file"

  web:
    name: Deploy the landing page and the docs site
    # The landing page is the site of the project. A fork deploys only its CMS.
    if: ${{ github.repository == 'rimzzlabs/daluang' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check the settings of the repository
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/install

      - run: pnpm web:build

      # The custom domain daluang.rimzzlabs.com is in apps/web/wrangler.jsonc.
      - name: Deploy the landing page and the docs site
        working-directory: apps/web
        run: pnpm exec wrangler deploy

packages:
  - apps/*
  - packages/*

# `pnpm add` writes each new version here, so all workspaces use one version.
catalog:
  '@astrojs/check': ^0.9.10
  '@astrojs/cloudflare': ^14.4.0
  '@astrojs/react': ^7.1.0
  '@base-ui/react': ^1.9.0
  '@biomejs/biome': ^2.5.15
  '@cloudflare/workers-types': ^5.20261015.1
  '@commitlint/cli': ^21.2.3
  '@commitlint/config-conventional': ^21.2.3
  '@commitlint/prompt-cli': ^21.2.3
  '@fontsource-variable/inter': ^5.3.0
  '@fontsource-variable/jetbrains-mono': ^5.3.0
  '@fontsource-variable/lora': ^5.3.0
  '@mobily/ts-belt': 4.0.0-rc.5
  '@phosphor-icons/react': ^2.1.10
  '@tailwindcss/vite': ^4.3.3
  '@testing-library/dom': ^10.4.2
  '@testing-library/react': ^16.3.3
  '@testing-library/user-event': ^14.6.8
  '@types/node': ^24.19.2
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitest/coverage-v8': ^5.0.5
  astro: ^7.4.0
  better-auth: ^1.7.10
  class-variance-authority: ^0.7.1
  cn: ^0.4.0
  jsdom: ^30.1.3
  lefthook: ^2.2.2
  oxc-transform-react: ^0.152.0
  prettier: ^3.9.10
  react: ^19.3.1
  react-dom: ^19.3.1
  # No range. The RSC runtime of Waku in `apps/docs` must have the version of
  # `react` in the lockfile. Change the two together.
  react-server-dom-webpack: 19.3.1
  tailwindcss: ^4.3.3
  ts-pattern: ^5.9.2
  tw-animate-css: ^1.4.0
  # `astro check` needs the compiler API of TypeScript 6, and TypeScript 7 has no
  # such API. All workspaces use the version of Astro.
  typescript: ^6.0.3
  # The version that Astro 7 resolves. Vocs 2 asks for Vite 8.
  vite: ^8.3.4
  vitest: ^5.0.5
  vocs: ^2.10.3
  # No range. Waku 1.0 is a release candidate, and Vocs 2 follows its releases.
  waku: 1.0.0-rc.3
  wrangler: ^4.151.0
  zod: ^4.6.7

catalogMode: prefer

# The `prepare` script of the root package installs the Git hooks. The install
# script of `lefthook` does the same work, so it does not run.
allowBuilds:
  lefthook: false
  # Each of these install scripts checks for a platform binary. pnpm installs
  # that binary as an optional dependency, so the check is not necessary.
  esbuild: false
  workerd: false
  # Dependencies of `vocs` in `apps/docs`. `es5-ext` only prints a message.
  # `vue-demi` sets up the Vue version of the OpenAPI client of Vocs, which the
  # site does not use.
  es5-ext: false
  vue-demi: false

# `@astrojs/react` 7.1.0 asks for `oxc-transform-react` 0.145. The plugin that
# runs the React Compiler, `@vitejs/plugin-react` 6.1.2, needs 0.152.
peerDependencyRules:
  allowedVersions:
    '@astrojs/react>oxc-transform-react': ^0.152.0
